<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Half Shot Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fredoka:wght@500;600&family=Luckiest+Guy&family=Patrick+Hand&display=swap">
<style>
/* Layout: cut-out cardboard panels pinned to teal shop wallpaper; the shop floor is a cartoon side view */
:root{
  --ink:#2a1b12; --ink-soft:#6b5242;
  --wall:#39a39b; --wall-2:#2f8c85; --paper:#fff3d6; --paper-2:#f6dfae;
  --wood:#c27c43; --wood-2:#8a4f25; --floor:#f0d49c; --floor-2:#e3be7c;
  --mustard:#f5b53a; --tomato:#e8513a; --leaf:#5fb847; --leaf-ink:#2f7d22; --sky:#bfe6ee; --steel:#cbd5d8; --board-green:#2e3d34;
  /* names the game markup already uses */
  --chalk:var(--ink); --dim:var(--ink-soft); --crema:var(--mustard); --berry:var(--tomato); --mint:var(--leaf); --line:rgba(42,27,18,.28);
  --f-display:'Luckiest Guy','Arial Black',Impact,sans-serif;
  --f-body:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;
  --f-num:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-receipt:'Courier Prime','Courier New',monospace;
  color-scheme:light;
}
html,body{background-color:var(--wall);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.35;
  background-image:repeating-linear-gradient(90deg,transparent 0 34px,var(--wall-2) 34px 39px)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}

/* shared cardboard look */
.list,.scene,.log,.banner,.clock,.daylabel{background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.3rem,9vw,3.4rem);line-height:.95;margin:0;color:var(--mustard);letter-spacing:.02em;transform:rotate(-2.5deg);transform-origin:left;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink),5px 6px 0 var(--ink)}
.tagline{color:var(--paper);font-size:1.05rem;margin:8px 0 0;text-shadow:1px 1px 0 var(--wall-2)}
.daylabel{font-family:var(--f-display);font-size:1.35rem;line-height:1;padding:9px 14px 6px;border-radius:12px 8px 14px 9px;transform:rotate(3deg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:6px 16px 16px 6px;box-shadow:4px 4px 0 var(--ink);padding:8px 10px 9px 26px;min-width:0}
.stat:nth-child(odd){transform:rotate(-1.4deg)} .stat:nth-child(even){transform:rotate(1.1deg)}
.stat::before{content:"";position:absolute;left:8px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--wall);border:2px solid var(--ink)}
.stat .k{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{font-family:var(--f-num);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.stat .s{font-size:.9rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:var(--paper-2);border:2px solid var(--ink);border-radius:6px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mustard);transition:width .4s}

.tabs{display:flex;gap:6px;padding-left:10px;position:relative;z-index:1;margin-bottom:-3px}
.tabs button{background:var(--paper-2);border:3px solid var(--ink);border-bottom:0;border-radius:12px 14px 0 0;padding:8px 13px 5px;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.03em;color:var(--ink-soft);transform:translateY(4px)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);transform:none;padding-bottom:9px}

.list{display:flex;flex-direction:column;border-radius:4px 14px 12px 14px;padding:4px 16px 14px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line)}
.item b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;letter-spacing:.02em}
.sub{display:block;font-size:.95rem;color:var(--ink-soft)}
.sub .good{color:var(--leaf-ink)} .sub .bad{color:var(--tomato)}
.stepper{display:flex;align-items:center;gap:7px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--mustard);border:3px solid var(--ink);box-shadow:2px 3px 0 var(--ink);font-family:var(--f-num);font-weight:600;font-size:1.2rem;line-height:1;padding:0}
.stepper button:active,.btn:active,.speeds button:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.price{font-family:var(--f-num);font-weight:600;min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:1.15rem}
.btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:#fff;border:3px solid var(--ink);border-radius:9px 7px 10px 8px;box-shadow:3px 3px 0 var(--ink);padding:6px 11px;font-size:1rem;white-space:nowrap}
.btn .m{font-family:var(--f-num);font-weight:600;color:var(--tomato)}
.owned{font-family:var(--f-display);font-size:.9rem;letter-spacing:.04em;color:var(--paper);background:var(--leaf);border:3px solid var(--ink);border-radius:8px;padding:5px 9px 3px;transform:rotate(-4deg);display:inline-block;box-shadow:2px 2px 0 var(--ink)}
.note{font-size:1rem;color:var(--ink-soft);margin:12px 0 0}
.note strong{color:var(--ink)}

.open{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.big{background:var(--tomato);color:var(--paper);border:3px solid var(--ink);border-radius:14px 10px 16px 12px;box-shadow:6px 6px 0 var(--ink);padding:14px 18px 11px;font-family:var(--f-display);font-size:1.6rem;letter-spacing:.03em;transform:rotate(-.8deg);
  text-shadow:2px 2px 0 var(--ink)}
.big:hover{filter:brightness(1.06)}
.big:active{transform:rotate(-.8deg) translate(4px,5px);box-shadow:1px 1px 0 var(--ink)}

/* running */
.scene{position:relative;border-radius:14px 10px 16px 12px;overflow:hidden;background:var(--sky)}
canvas{display:block;width:100%;height:290px}
.runbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.clock{font-family:var(--f-display);font-size:1.8rem;line-height:1;padding:9px 14px 5px;border-radius:10px 14px 9px 12px;transform:rotate(-2deg);font-variant-numeric:tabular-nums}
.speeds{display:flex;gap:6px}
.speeds button{background:var(--paper);border:3px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);padding:5px 11px;font-family:var(--f-num);font-weight:600;font-size:.95rem}
.speeds button[aria-pressed="true"]{background:var(--mustard)}
.live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:560px){.live{grid-template-columns:repeat(2,minmax(0,1fr))}}
.log{font-size:1rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px;max-height:170px;overflow:auto;margin:0;padding:10px 14px;list-style:none;border-radius:12px 8px 12px 10px}
.log li.warn{color:var(--tomato)} .log li.ok{color:var(--leaf-ink)}

/* receipt, taped up */
.receipt{background:#fffdf6;color:var(--ink);font-family:var(--f-receipt);font-size:.85rem;padding:30px 20px 34px;max-width:420px;width:100%;margin:0 auto;position:relative;transform:rotate(1.5deg);
  filter:drop-shadow(5px 6px 0 var(--ink));
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x}
.receipt::before{content:"";position:absolute;top:0;left:50%;width:110px;height:22px;margin-left:-55px;background:rgba(245,181,58,.7);transform:rotate(-3deg)}
.receipt h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;letter-spacing:.03em;text-align:center;margin:0;color:var(--tomato)}
.receipt .c{text-align:center;color:var(--ink-soft);margin:2px 0 12px}
.receipt hr{border:0;border-top:2px dashed var(--ink-soft);margin:10px 0}
.rl{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.rl.tot{font-weight:700;font-size:1.02rem}
.rl .neg{color:#b23a22} .rl .pos{color:var(--leaf-ink)}
.tips{margin:12px 0 0;padding:0 0 0 18px;font-family:var(--f-body);font-size:1.02rem;color:var(--ink)}
.tips li{margin:4px 0}
.banner{border-radius:12px 16px 10px 14px;padding:14px 16px;text-align:center;transform:rotate(-1deg)}
.banner b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;letter-spacing:.03em;color:var(--tomato);display:block}

footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--paper);font-size:.95rem;border-top:3px dashed rgba(255,243,214,.45);padding-top:12px}
.link{background:none;border:0;color:var(--paper);text-decoration:underline;padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.scene{background:var(--sky)}
.runleft{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rush{font-family:var(--f-display);font-size:1rem;letter-spacing:.03em;background:var(--tomato);color:var(--paper);border:3px solid var(--ink);border-radius:8px;padding:5px 10px 2px;box-shadow:3px 3px 0 var(--ink);transform:rotate(3deg);text-shadow:1px 1px 0 var(--ink)}
.item.locked{opacity:.5}
.item .tier{font-family:var(--f-num);font-weight:600;font-size:.85rem;color:var(--paper);background:var(--ink);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.chip{font-family:var(--f-display);font-size:.85rem;letter-spacing:.04em;border:3px solid var(--ink);border-radius:8px;padding:5px 9px 3px;display:inline-block;background:var(--paper-2);color:var(--ink-soft)}
.pips{display:inline-flex;gap:4px;vertical-align:-1px;margin-left:6px}
.pips i{width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;background:#fff}
.pips i.on{background:var(--leaf)}
.perk{color:var(--leaf-ink)}
.summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:12px 0 8px;border-bottom:2px dashed var(--line);font-size:1rem}
.summary b{font-family:var(--f-num);font-weight:600}
.alert{background:var(--mustard);border:3px solid var(--ink);border-radius:10px 14px 9px 12px;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-size:1.02rem;transform:rotate(-.6deg)}
.alert.hot{background:var(--tomato);color:var(--paper)}
.alert b{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
.btn.go{background:var(--leaf);color:var(--ink)}
.btn.go .m{color:var(--ink)}
@media (max-width:480px){.tabs{gap:4px;padding-left:4px}.tabs button{padding:7px 8px 4px;font-size:.9rem}}
/* one-screen app layout: phone shows plan or shop; desktop shows both side by side */
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.app>header,.app>.stats,.app>footer{grid-column:1/-1}
header{flex-wrap:nowrap}
#main{grid-row:3;display:flex;flex-direction:column;min-height:0;min-width:0}
#side{grid-row:3;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
#main .list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.alerts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;flex-shrink:0;max-height:34%;overflow:auto;padding:0 6px 6px 0}
.actionbar{flex-shrink:0;margin-top:14px;display:flex;flex-direction:column}
.actionbar:empty{display:none}
.reportscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:6px 10px 18px 4px}
.scene{flex:1;min-height:160px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#side .log{flex-shrink:0;max-height:130px}
#main.busy{pointer-events:none;opacity:.55}
footer{padding-top:8px}
@media (max-width:899px){
  .app.running #main{display:none}
  .app:not(.running) #side{display:none}
}
@media (min-width:900px){
  .app{grid-template-columns:minmax(380px,1fr) minmax(0,1.3fr);column-gap:26px;padding-block:16px 10px}
  #main{grid-column:1} #side{grid-column:2}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:26px;align-content:start}
  .list>.note,.list>.summary{grid-column:1/-1}
}
@media (max-width:600px){
  .app{gap:9px;padding-block:8px 6px}
  h1{font-size:1.75rem}
  .tagline{display:none}
  .daylabel{font-size:1rem;padding:6px 10px 4px}
  .stats,.live{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .stat{padding:5px 6px 6px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
  .stat::before{display:none}
  .stat .k{font-size:.6rem;letter-spacing:.03em}
  .stat .v{font-size:.95rem}
  .stat .v span,.stat .s{display:none}
  .bar{height:6px;margin-top:3px;border-width:1.5px}
  .list{padding:2px 12px 10px}
  .big{font-size:1.3rem;padding:11px 14px 8px}
  .actionbar{margin-top:10px}
  .alerts{margin-bottom:10px}
  .alert{padding:7px 11px;font-size:.95rem}
  .clock{font-size:1.35rem;padding:7px 10px 4px}
  .rush{font-size:.85rem}
  .speeds button{padding:4px 8px;font-size:.85rem}
  #side{gap:9px}
  #side .log{max-height:78px;font-size:.9rem;padding:6px 10px}
  #footnote{display:none}
  footer{padding-top:5px;font-size:.85rem;justify-content:flex-end}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div>
      <h1>Half Shot Café</h1>
      <p class="tagline" id="tagline">A folding table on the sidewalk outside your apartment.</p>
    </div>
    <div class="daylabel" id="daylabel">Day 1 · Mon</div>
  </header>

  <section class="stats" id="stats"></section>

  <main id="main"></main>

  <aside id="side">
    <div class="runbar" id="runbar" hidden><div class="runleft"><div class="clock" id="clock">7:00 AM</div><span class="rush" id="rush" hidden></span></div>
      <div class="speeds" role="group" aria-label="Simulation speed">
        <button data-act="speed" data-v="1" aria-pressed="true">1×</button><button data-act="speed" data-v="2" aria-pressed="false">2×</button><button data-act="speed" data-v="4" aria-pressed="false">4×</button><button data-act="speed" data-v="40" aria-pressed="false">Skip</button>
      </div></div>
    <div class="scene"><canvas id="cv" aria-label="Your shop: customers line up while baristas make drinks"></canvas></div>
    <div class="live" id="live" hidden>
      <div class="stat"><div class="k">Served</div><div class="v" id="l-served">0</div></div>
      <div class="stat"><div class="k">Walked out</div><div class="v" id="l-lost">0</div></div>
      <div class="stat"><div class="k">Sales</div><div class="v" id="l-sales">$0</div></div>
      <div class="stat"><div class="k">In line</div><div class="v" id="l-line">0</div></div>
    </div>
    <ul class="log" id="log" hidden></ul>
  </aside>

  <footer>
    <span id="footnote"></span>
    <span id="resetwrap"><button class="link" data-act="reset">New game</button></span>
  </footer>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const compact = a => a >= 1e9 ? (a / 1e9).toFixed(a >= 1e10 ? 1 : 2) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
const money = n => { const a = Math.abs(n), s = n < 0 ? '−$' : '$'; return s + (a < 1000 ? a.toFixed(2) : a < 1e4 ? Math.round(a).toLocaleString() : compact(a)); };
const money0 = n => { const a = Math.abs(n), s = n < 0 ? '−$' : '$'; return s + (a < 1e5 ? Math.round(a).toLocaleString() : compact(a)); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const nice = x => { const e = 10 ** Math.floor(Math.log10(x)), f = x / e; return (f < 1.5 ? 1 : f < 2.25 ? 2 : f < 3.5 ? 2.5 : f < 7.5 ? 5 : 10) * e; };
const roundTo = (v, s) => Math.max(s, Math.round(v / s) * s);

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW = [0.9, 0.95, 1, 1, 1.1, 1.3, 1.2];
// Half-hour arrival weights, 7:00 AM to 7:00 PM: morning peak, lunch peak, afternoon slump, last-call rush
const SLOTS = [1.6,2.6,3.0,2.8,2.2,1.6, 1.1,0.9,0.9,1.4, 2.2,2.4,1.8,1.2, 0.8,0.7,0.9,1.0,0.8,0.9, 1.2,1.6,2.0,2.2];
const SSUM = SLOTS.reduce((a, b) => a + b, 0), SMAX = Math.max(...SLOTS);
const OPEN = 7 * 3600, CLOSE = 19 * 3600;
const GS = 480; // game seconds per real second at 1x (12 h ≈ 90 s)
const SAVE = 'halfshot-v2';

const LOC = [
  {name:'Folding table', where:'A folding table on the sidewalk outside your apartment.', rent:0, move:0, pm:0.85, vb:22, vr:0.35, staff:1, slots:1, q:4, scene:'table', crowd:'human', earth:true,
   pal:{wall:'#5fa8d3','wall-2':'#4f97c2',sky:'#bfe6ee',floor:'#c9c4ba','floor-2':'#b8b3a8',wood:'#f3f0e6','wood-2':'#9a958b'}},
  {name:'Food truck', where:'A rented food truck parked by the office park.', rent:1000, move:2000, pm:1.1, vb:45, vr:0.8, staff:2, slots:1, q:6, scene:'truck', crowd:'human', earth:true,
   pal:{wall:'#e0913a','wall-2':'#cf7f2a',sky:'#bfe6ee',floor:'#6d6a70','floor-2':'#5f5c62',wood:'#e8513a','wood-2':'#b23a22'}},
  {name:'Small shop', where:'A narrow little shop on Elm Street.', rent:2500, move:5000, pm:1.5, vb:90, vr:1.5, staff:3, slots:2, q:8, scene:'small', crowd:'human', earth:true,
   pal:{wall:'#39a39b','wall-2':'#2f8c85',sky:'#bfe6ee',floor:'#f0d49c','floor-2':'#e3be7c',wood:'#c27c43','wood-2':'#8a4f25'}},
  {name:'Downtown flagship', where:'Brick walls, big windows and too many plants. Downtown.', rent:10000, move:20000, pm:2.6, vb:110, vr:2, staff:4, slots:2, q:10, scene:'downtown', crowd:'human', earth:true,
   pal:{wall:'#a8483a','wall-2':'#93392c',sky:'#ffd59a',floor:'#c98f5a','floor-2':'#b57d4b',wood:'#6b4a33','wood-2':'#4a3222'}},
  {name:'Orbital café', where:'A café ring on a space station in low Earth orbit.', rent:50000, move:100000, pm:9, vb:130, vr:2.2, staff:5, slots:3, q:11, scene:'orbital', crowd:'orbital', zeroG:true,
   pal:{wall:'#1f2a4d','wall-2':'#18213f',sky:'#0b0e1a',floor:'#8f98a6','floor-2':'#7d8694',wood:'#e7ebf0','wood-2':'#b8c0cc'}},
  {name:'Moon base café', where:'Under the dome at Tranquility Base.', rent:250000, move:500000, pm:40, vb:150, vr:2.4, staff:5, slots:3, q:12, scene:'moon', crowd:'moon',
   pal:{wall:'#4a4f5c','wall-2':'#3d424e',sky:'#0b0e1a',floor:'#b7b9bd','floor-2':'#a6a8ad',wood:'#dfe3e8','wood-2':'#9aa3ad'}},

function rollWeather() {
  let r = Math.random(), w = WEATHER[0];
  for (const x of WEATHER) { if (r < x.p) { w = x; break; } r -= x.p; }
  return {id: w.id, temp: Math.round(rand(...w.temp))};
}
const W_OF = id => WEATHER.find(w => w.id === id);

function newGame() {
  const pm = LOC[0].pm, st = nice(pm * 0.25);
  const prices = {}; for (const d of DRINKS) prices[d.id] = roundTo(d.base * pm, st); prices.pastry = roundTo(PASTRY_BASE * pm, st);
  return {day:1, tier:0, cash:250, rep:20, staff:1, up:{}, exp:{}, rentDue:0,
    inv:{beans:2, milk:1, cups:60, pastry:0}, prices,
    weather:rollWeather(), forecast:rollWeather(), history:[], won:false, over:false, overWhy:''};
}
function load() { try { const s = JSON.parse(localStorage.getItem(SAVE)); return s && s.prices && s.exp ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }

const LC = () => LOC[S.tier];
const priceStep = () => nice(LC().pm * 0.25);
const beanMult = () => (S.exp.roaster ? 0.65 : 1) * (S.exp.plantation ? 0.4 : 1);
const supCost = k => SUP[k].cost * LC().pm * 0.9 * (k === 'beans' ? beanMult() : 1);
const drinkCost = d => d.lb * supCost('beans') / SUP.beans.pack + d.gal * supCost('milk') + supCost('cups') / SUP.cups.pack;
const wage = () => 112 * Math.pow(LC().pm, 0.9);
const quality = () => 0.55 + (S.up.grinder ? 0.15 : 0);
const slots = () => LC().slots + (S.up.machine2 ? 2 : 0);
const maxQ = () => LC().q + (S.up.seating ? 3 : 0);
const expectedVisitors = () => (LC().vb + S.rep * LC().vr) * (S.up.sign ? 1.12 : 1) * (1 + 0.08 * (S.exp.drones || 0)) * DOW[(S.day - 1) % 7] * W_OF(S.weather.id).traffic;
const fmtTime = t => { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); const hh = ((h + 11) % 12) + 1; return hh + ':' + String(m).padStart(2,'0') + (h < 12 ? ' AM' : ' PM'); };
const rentIn = () => S.rentDue - S.day + 1;

/* expansions */
const expInc = (e, L) => e.inc * Math.pow(1.4, L - 1);
const expUp = (e, L) => e.up * Math.pow(1.3, L - 1);
const expCost = (e, L) => e.cost * Math.pow(1.6, L - 1); // price of reaching level L
function expNet(e, L) {
  if (!L) return 0;
  return expInc(e, L) * (0.5 + S.rep / 100) * (e.weekend ? 2 / 7 : 1) * (e.weather ? 0.97 : 1) * (e.breakdown ? 1 - e.breakdown : 1) - expUp(e, L);
}
const expTotal = () => EXP.reduce((a, e) => a + expNet(e, S.exp[e.id] || 0), 0);

/* ---------- simulation ---------- */
function rateAt(t) {
  const i = Math.floor((t - OPEN) / 1800);
  if (i < 0 || i >= SLOTS.length) return 0;
  return sim.visitors * SLOTS[i] / SSUM / 1800;
}
const nextArrival = t => t - Math.log(1 - Math.random()) / sim.maxRate;
function rushLabel(t) {
  const i = Math.floor((t - OPEN) / 1800);
  if (i < 0 || i >= SLOTS.length || SLOTS[i] < 1.6) return '';
  return t < 11 * 3600 ? 'Morning rush' : t < 15 * 3600 ? 'Lunch rush' : 'Last call';
}

function startDay() {
  phase = 'run'; welcome = null;
  sim = {t: OPEN, closed:false, queue:[], baristas: Array.from({length:S.staff}, () => ({busy:0, cust:null, start:0})),
    mUsed:0, visitors: expectedVisitors() * rand(0.9, 1.1), arrived:0, served:0,
    lost:{price:0, line:0, wait:0, stock:0}, sales:0, tips:0, pastrySold:0, satSum:0, waitSum:0,
    sold:{}, stockOut:{}, hour:7, hServed:0, hLost:0, logs:[], people:[], floats:[], speed:1, done:false};
  sim.maxRate = sim.visitors * SMAX / SSUM / 1800;
  sim.next = nextArrival(OPEN);
  renderRun();
  addLog('7:00 AM · Doors open. ' + wname(S.weather.id) + (wgroup() === 'earth' ? ', ' + S.weather.temp + '°F.' : '.'));
}

function pickDrink() {
  const w = W_OF(S.weather.id).w;
  let tot = 0; for (const d of DRINKS) tot += w[d.id];
  let r = Math.random() * tot;
  for (const d of DRINKS) { if ((r -= w[d.id]) <= 0) return d; }
  return DRINKS[0];
}
function wtpMult() { return (0.95 + S.rep / 300 + (quality() - 0.55)) * (0.85 + Math.random() * 0.5); }

function arrive(t) {
  sim.arrived++;
  const pm = LC().pm, d = pickDrink(), wtp = d.base * pm * wtpMult();
  const c = {d, wtp, arrival:t, pastry:false};
  c.wantsPastry = Math.random() < (S.up.seating ? 0.38 : 0.28) && S.prices.pastry <= PASTRY_BASE * pm * wtpMult();
  const patience = rand(480, 840) * (S.up.music ? 1.2 : 1) * (S.up.seating ? 1.25 : 1);
  c.deadline = t + patience; c.patience = patience;
  c.p = spawnPerson(c);
  if (sim.queue.length >= maxQ()) return lose(c, 'line');
  if (S.prices[d.id] > wtp) return lose(c, 'price');
  sim.queue.push(c);
  c.p.state = 'queue';
}

function lose(c, why) {
  sim.lost[why]++; sim.hLost++;
  const label = {price:'too pricey', line:'line too long', wait:'gave up waiting', stock:'sold out'}[why];
  if (c.p) { c.p.state = 'balk'; c.p.balkT = why === 'wait' ? 0 : 0.5; floatText(c.p.x, c.p.y - 14, label, 'bad'); }
}

function startNext(b) {
  while (sim.queue.length) {
    const c = sim.queue[0], d = c.d;
    if (d.mach && sim.mUsed >= slots()) return;
    const short = S.inv.beans < d.lb ? 'beans' : S.inv.milk < d.gal ? 'milk' : S.inv.cups < 1 ? 'cups' : null;
    sim.queue.shift();
    if (short) {
      if (!sim.stockOut[short]) { sim.stockOut[short] = true; addLog(fmtTime(sim.t) + ' · Out of ' + short + '!', 'warn'); }
      lose(c, 'stock'); continue;
    }
    S.inv.beans -= d.lb; S.inv.milk -= d.gal; S.inv.cups -= 1;
    if (c.wantsPastry) {
      if (S.inv.pastry > 0) { S.inv.pastry--; c.pastry = true; }
      else if (!sim.stockOut.pastry) { sim.stockOut.pastry = true; addLog(fmtTime(sim.t) + ' · Croissants sold out.', 'warn'); }
    }
    if (d.mach) { sim.mUsed++; c.mach = true; }
    c.start = sim.t;
    b.cust = c; b.start = sim.t; b.busy = sim.t + d.t * rand(0.85, 1.15) + (c.pastry ? 25 : 0);
    c.p.state = 'serve'; c.p.station = sim.baristas.indexOf(b);
    return;
  }
}

function finish(b) {
  const c = b.cust, d = c.d;
  const price = S.prices[d.id] + (c.pastry ? S.prices.pastry : 0);
  sim.sales += price; sim.served++; sim.hServed++;
  sim.sold[d.id] = (sim.sold[d.id] || 0) + 1;
  if (c.pastry) sim.pastrySold++;
  const wait = c.start - c.arrival; sim.waitSum += wait;
  const ws = 1 - (wait / c.patience) * 1.4;
  const ps = clamp((c.wtp - S.prices[d.id]) / S.prices[d.id] * 2, -1, 1);
  const sat = clamp(0.5 * ws + 0.3 * ps + 0.1 + (quality() - 0.55) * 1, -1, 1);
  sim.satSum += sat;
  let tip = 0;
  if (sat > 0.5 && Math.random() < 0.35) { tip = (0.5 + Math.floor(Math.random() * 4) * 0.5) * LC().pm; sim.tips += tip; }
  if (c.mach) sim.mUsed--;
  b.cust = null;
  c.p.state = 'leave'; c.p.cup = true; c.p.happy = sat;
  floatText(c.p.x, c.p.y - 14, '+' + money(price + tip), 'good');
}

function step(dt) {
  const end = sim.t + dt;
  while (!sim.closed && sim.next <= end && sim.next < CLOSE) {
    if (Math.random() * sim.maxRate < rateAt(sim.next)) arrive(sim.next);
    sim.next = nextArrival(sim.next);
  }
  sim.t = end;
  for (let i = sim.queue.length - 1; i >= 0; i--) {
    const c = sim.queue[i];
    if (sim.t > c.deadline) { sim.queue.splice(i, 1); lose(c, 'wait'); }
  }
  for (const b of sim.baristas) {
    if (b.cust && sim.t >= b.busy) finish(b);
    if (!b.cust) startNext(b);
  }
  const h = Math.floor(sim.t / 3600);
  if (h > sim.hour && sim.hour < 19) {
    if (sim.hServed || sim.hLost) addLog(fmtTime(sim.hour * 3600) + ' hour · ' + sim.hServed + ' served' + (sim.hLost ? ', ' + sim.hLost + ' walked out' : ''), sim.hLost > 3 ? 'warn' : '');
    sim.hServed = sim.hLost = 0; sim.hour = h;
  }
  if (!sim.closed && sim.t >= CLOSE) { sim.closed = true; addLog('7:00 PM · Doors locked. Finishing the line.'); }
  if (sim.closed && !sim.queue.length && sim.baristas.every(b => !b.cust) && !sim.done) { sim.done = true; setTimeout(endDay, 700); }
}

function addLog(text, cls = '') {
  sim.logs.unshift({text, cls});
  const el = $('#log'); if (!el) return;
  el.innerHTML = sim.logs.slice(0, 30).map(l => `<li class="${l.cls}">${l.text}</li>`).join('');
}

function runExpansions() {
  const out = {inc:0, up:0, notes:[]};
  const dow = (S.day - 1) % 7;
  for (const e of EXP) {
    const L = S.exp[e.id]; if (!L) continue;
    out.up += expUp(e, L);
    let inc = expInc(e, L) * (0.5 + S.rep / 100) * (1 + e.v * rand(-1, 1));
    if (e.weekend && dow < 5) inc = 0;
    if (e.weather) inc *= WF[S.weather.id];
    if (e.breakdown && Math.random() < e.breakdown) { inc = 0; out.notes.push(e.name + ' broke down today and earned nothing.'); }
    out.inc += Math.max(0, inc);
  }
  return out;
}

function endDay() {
  if (!sim || phase !== 'run') return;
  const L = LC();
  const wages = (S.staff - 1) * wage();
  const tossed = S.inv.pastry; S.inv.pastry = 0;
  const ex = runExpansions();
  let rentBill = 0;
  if (L.rent && S.day >= S.rentDue) { rentBill = L.rent; S.rentDue += 30; }
  const net = sim.sales + sim.tips - wages - rentBill + ex.inc - ex.up;
  S.cash += net;
  const lostAll = sim.lost.price + sim.lost.line + sim.lost.wait + sim.lost.stock;
  const total = sim.served + lostAll;
  let delta = (sim.satSum - 0.7 * (sim.lost.wait + sim.lost.line) - 0.9 * sim.lost.stock - 0.15 * sim.lost.price) / Math.max(total, 1) * 12 + sim.served / 120;
  if (delta > 0) delta *= (1 - S.rep / 125);
  delta = clamp(delta, -7, 7);
  const oldRep = S.rep;
  S.rep = clamp(S.rep + delta, 0, 100);
  const best = Object.entries(sim.sold).sort((a, b) => b[1] - a[1])[0];
  report = {day:S.day, dow:DAYS[(S.day - 1) % 7], weather:{...S.weather}, wlabel:wname(S.weather.id), earth:wgroup() === 'earth', place:L.name,
    visitors:sim.arrived, served:sim.served, lost:{...sim.lost},
    sales:sim.sales, tips:sim.tips, wages, rentBill, exInc:ex.inc, exUp:ex.up, exNotes:ex.notes, net, tossed, pastrySold:sim.pastrySold,
    best: best ? DMAP[best[0]].name + ' (' + best[1] + ')' : '—', avgWait: sim.served ? sim.waitSum / sim.served / 60 : 0,
    repFrom:oldRep, repTo:S.rep, stockOut:Object.keys(sim.stockOut), staff:S.staff, maxStaff:L.staff};
  S.history.push({day:S.day, net, cash:S.cash});
  S.day++; S.weather = S.forecast; S.forecast = rollWeather();
  if (S.cash < 0) { S.over = true; S.overWhy = rentBill ? 'The rent check bounced and the landlord changed the locks.' : 'The shop ran out of money.'; }
  save();
  phase = 'report';
  render();
}

function doMove() {
  const from = LC(), to = LOC[S.tier + 1];
  if (!to || S.cash < to.move) return;
  S.cash -= to.move;
  S.tier++;
  const ratio = to.pm / from.pm, st = priceStep();
  for (const k in S.prices) S.prices[k] = roundTo(S.prices[k] * ratio, st);
  S.rentDue = S.day + 29;
  if (S.tier === FINAL) S.won = true;
  welcome = to.name; confirmMove = false; tab = 'menu';
  save(); render(); scrollTo(0, 0);
}

function updateVisuals(dt) {
  const g = geo(), fast = sim.speed >= 40;
  const sp = 150 * Math.min(sim.speed, 4);
  for (const p of sim.people) {
    if (p.state === 'leave' && p.cup && !p.sat && S.up.seating && !sim.closed) {
      p.sat = true;
      if (Math.random() < .5) { sim.seats = sim.seats || Array(SEATS).fill(null); const i = sim.seats.indexOf(null); if (i >= 0) { sim.seats[i] = p; p.state = 'sit'; p.seat = i; p.until = sim.t + rand(1200, 2700); } }
    }
    if (p.state === 'sit' && (sim.t > p.until || sim.closed)) { sim.seats[p.seat] = null; p.state = 'leave'; }
    let tx, ty;
    if (p.state === 'sit') { const s = seatPos(p.seat); tx = s.x; ty = s.y; }
    else if (p.state === 'queue' || p.state === 'walk') {
      const i = sim.queue.indexOf(p.c); const s = queueSlot(Math.max(0, i)); tx = s.x; ty = s.y;
    } else if (p.state === 'serve') { tx = stationX(p.station); ty = g.serveY; }
    else if (p.state === 'balk') {
      tx = Math.min(p.x + 24, g.x0 - 40); ty = Math.max(p.y, g.door.y + 26);
      p.balkT -= dt * Math.min(sim.speed, 4);
      if (p.balkT <= 0) p.state = 'leave';
    } else { tx = g.door.x; ty = g.door.y; }
    const dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
    p.moving = !fast && dist > 1;
    p.seated = p.state === 'sit' && (fast || dist < sp * dt);
    if (fast || dist < sp * dt) { p.x = tx; p.y = ty; } else { p.x += dx / dist * sp * dt; p.y += dy / dist * sp * dt; }
    if (p.state === 'leave' && Math.hypot(p.x - g.door.x, p.y - g.door.y) < 2) p.gone = true;
  }
  sim.people = sim.people.filter(p => !p.gone);
  for (const f of sim.floats) { f.life -= dt; f.y -= 18 * dt; }
  sim.floats = sim.floats.filter(f => f.life > 0);
}

function figure(x, y, o, t) {
  const P = colors;
  let bob = o.moving ? Math.abs(Math.sin(t * 14 + (o.seed || 0))) * 2.5 : 0;
  if (o.sit) bob = 0;
  else if (LC().zeroG && !o.apron) bob += 3 + Math.sin(t * 2 + (o.seed || 0)) * 3;
  ctx.fillStyle = 'rgba(42,27,18,.2)'; ctx.beginPath(); ctx.ellipse(x, y + 1, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  y -= bob;
  const k = o.kind || 'human';
  if (k === 'blob') {
    ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.quadraticCurveTo(x - 17, y - 36, x, y - 40); ctx.quadraticCurveTo(x + 17, y - 36, x + 14, y); ctx.quadraticCurveTo(x, y + 3, x - 14, y); paint(o.skin);
    circ(x, y - 26, 6); paint('#fff', 2); circ(x + 1, y - 25, 2.5); ctx.fillStyle = P.ink; ctx.fill();
    if (o.cup) { rr(x + 10, y - 22, 9, 12, 2); paint('#ffffff', 2); }
    if (o.mood === 'mad') { ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, y - 35); ctx.lineTo(x + 6, y - 32); ctx.stroke(); }
    if (o.mood === 'happy') { ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 15, 4, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
    return;
  }
  if (!o.sit) { rr(x - 7, y - 11, 6, 11, 2); paint(P.ink, 1); rr(x + 1, y - 11, 6, 11, 2); paint(P.ink, 1); }
  rr(x - 11, y - 30, 22, 22, 7); paint(k === 'astro' ? '#f3f0e6' : k === 'robot' ? '#b8c0cc' : o.shirt);
  if (k === 'astro') { rr(x - 5, y - 25, 10, 7, 2); paint(o.shirt, 1.5); }
  if (o.apron) { rr(x - 7, y - 25, 14, 17, 3); paint(P.mustard, 2); }
  if (o.cup) { rr(x + 9, y - 27, 9, 12, 2); paint('#ffffff', 2); ctx.fillStyle = '#8a4f25'; ctx.fillRect(x + 10, y - 23, 7, 4); }
  const hy = y - 41;
  if (k === 'robot') {
    rr(x - 11, hy - 11, 22, 21, 4); paint(o.you ? '#d9c2a5' : '#cbd5d8');
    ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, hy - 11); ctx.lineTo(x, hy - 18); ctx.stroke(); circ(x, hy - 19, 2.5); paint(P.tomato, 1.5);
    rr(x - 7, hy - 4, 5, 4, 1); paint(o.mood === 'mad' ? P.tomato : '#7fe0ff', 1.5); rr(x + 2, hy - 4, 5, 4, 1); paint(o.mood === 'mad' ? P.tomato : '#7fe0ff', 1.5);
    ctx.beginPath(); ctx.moveTo(x - 5, hy + 5); ctx.lineTo(x + 5, hy + 5); ctx.stroke();
    if (o.you) { ctx.beginPath(); ctx.arc(x, hy - 11, 11, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); paint(o.hair, 2); }
    return;
  }
  circ(x, hy, 11.5); paint(o.skin);
  if (k === 'martian') {
    ctx.strokeStyle = P.ink; ctx.lineWidth = 2;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + s * 4, hy - 10); ctx.lineTo(x + s * 8, hy - 20); ctx.stroke(); circ(x + s * 8, hy - 21, 3); paint(o.skin, 1.5); }
  } else {
    ctx.fillStyle = o.hair;
    if (o.style === 0) { ctx.beginPath(); ctx.arc(x, hy, 11.5, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(x, hy - 3, x - 11.4, hy - 1); ctx.closePath(); paint(o.hair, 2); }
    else if (o.style === 1) { rr(x - 12, hy - 15, 24, 9, 4.5); paint(o.hat, 2); circ(x, hy - 16, 3); paint(o.hat, 2); }
    else if (o.style === 2) { ctx.beginPath(); ctx.arc(x, hy, 11.5, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); paint(o.hair, 2); circ(x, hy - 14, 5); paint(o.hair, 2); }
    else { ctx.beginPath(); ctx.arc(x, hy, 12, Math.PI * .95, Math.PI * 2.05); ctx.lineTo(x + 12, hy + 5); ctx.lineTo(x + 8, hy - 3); ctx.lineTo(x - 8, hy - 3); ctx.lineTo(x - 12, hy + 5); ctx.closePath(); paint(o.hair, 2); }
  }
  ctx.fillStyle = P.ink; ctx.strokeStyle = P.ink; ctx.lineWidth = 2;
  if (k === 'martian') { for (const ex of [-5, 0, 5]) { circ(x + ex, hy + (ex ? 1 : -3), 1.8); ctx.fill(); } }
  else { circ(x - 4, hy + 1, 1.7); ctx.fill(); circ(x + 4, hy + 1, 1.7); ctx.fill(); }
  ctx.beginPath();
  if (o.mood === 'happy') ctx.arc(x, hy + 4, 4, .15 * Math.PI, .85 * Math.PI);
  else if (o.mood === 'mad') {
    ctx.arc(x, hy + 9, 4, 1.2 * Math.PI, 1.8 * Math.PI);
    ctx.moveTo(x - 7, hy - 4); ctx.lineTo(x - 2, hy - 2); ctx.moveTo(x + 7, hy - 4); ctx.lineTo(x + 2, hy - 2);
  } else if (o.mood === 'worried') { ctx.moveTo(x - 3, hy + 6); ctx.lineTo(x + 3, hy + 6); }
  else if (o.mood === 'focus') { ctx.moveTo(x - 2, hy + 6); ctx.lineTo(x + 2, hy + 6); }
  else { ctx.moveTo(x - 3, hy + 6); ctx.quadraticCurveTo(x, hy + 7, x + 3, hy + 6); }
  ctx.stroke();
  if (o.mood === 'mad') { ctx.fillStyle = 'rgba(232,81,58,.35)'; circ(x - 7, hy + 4, 2.5); ctx.fill(); circ(x + 7, hy + 4, 2.5); ctx.fill(); }
  if (o.mood === 'worried') { ctx.beginPath(); ctx.moveTo(x + 12, hy - 8); ctx.quadraticCurveTo(x + 16, hy - 2, x + 12, hy - 1); ctx.quadraticCurveTo(x + 9, hy - 3, x + 12, hy - 8); paint('#7fd0ef', 1.5); }
  if (k === 'astro') {
    circ(x, hy, 16); ctx.fillStyle = 'rgba(191,230,238,.3)'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = P.ink; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, hy, 12.5, Math.PI * 1.15, Math.PI * 1.45); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
  }
}

function bubble(x, y, text, kind) {
  ctx.font = '17px "Patrick Hand", "Comic Sans MS", cursive';
  const w = ctx.measureText(text).width + 14, h = 22;
  x = clamp(x, w / 2 + 4, CW - w / 2 - 4);
  rr(x - w / 2, y - h, w, h, 9); paint('#ffffff', 2.5);
  ctx.beginPath(); ctx.moveTo(x - 5, y - 1.5); ctx.lineTo(x, y + 6); ctx.lineTo(x + 5, y - 1.5);
  ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = colors.ink;
  ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x + 5, y); ctx.stroke();
  ctx.fillStyle = kind === 'good' ? colors['leaf-ink'] : colors.tomato;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y - h / 2 + 1);
  ctx.textAlign = 'left';
}

function draw() {
  const g = geo(), P = colors, t = performance.now() / 1000, L = LC();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.clearRect(0, 0, CW, CH);
  backdrop(g, t);
  wallDecor(g, t);
  if (L.scene === 'truck') shelfStuff(g.x0, g.x1 - 16, g.shelfY);
  else if (L.scene !== 'table') shelfStuff(g.x0 - 6, g.x1 + 6, g.shelfY);
  // open stations you haven't hired for yet
  for (let i = sim.baristas.length; i < L.staff; i++) stool(stationX(i), g.counterY - 7);
  sim.baristas.forEach((b, i) => {
    const x = stationX(i);
    figure(x, g.counterY + 12, {skin:SKINS[(i * 2) % SKINS.length], hair:HAIRS[i % HAIRS.length], shirt:i ? P.leaf : P.tomato, style:[0, 2, 3, 1, 2, 3][i], hat:P.tomato, apron:true, mood:b.cust ? 'focus' : 'happy'}, t);
    if (b.cust) {
      const pr = clamp((sim.t - b.start) / Math.max(1, b.busy - b.start), 0, 1);
      const px = x + 15, py = g.counterY - 48;
      circ(px, py, 7); paint('#ffffff', 2);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, 5, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); ctx.closePath(); ctx.fillStyle = P.leaf; ctx.fill();
    }
  });
  const cw = g.cr - g.cl;
  if (L.scene === 'table') {
    const ux = g.cr - 6;
    ctx.strokeStyle = P.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ux, g.counterY + 2); ctx.lineTo(ux, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ux - 48, 28); ctx.quadraticCurveTo(ux, -4, ux + 48, 28); ctx.closePath(); paint(P.tomato, 2.5);
    for (const lx of [g.cl + 4, g.cr - 12]) { ctx.beginPath(); ctx.moveTo(lx, g.counterY + 6); ctx.lineTo(lx + 8, g.counterY + 40); ctx.moveTo(lx + 8, g.counterY + 6); ctx.lineTo(lx, g.counterY + 40); ctx.stroke(); }
    rr(g.cl, g.counterY, cw, 10, 2); paint('#f3f0e6');
    ctx.fillStyle = P.tomato; for (let x = g.cl + 4; x < g.cr - 4; x += 12) ctx.fillRect(x, g.counterY + 2, 6, 6);
    // milk crates hold the gear next to the table
    const ca = g.cr + 8, cb = Math.min(g.x1, ca + 172);
    if (cb - ca > 40) {
      for (let x = ca; x < cb - 10; x += 34) { rr(x, g.counterY - 2, Math.min(32, cb - x), 40, 3); paint('#3f7fd1', 2); ctx.strokeStyle = 'rgba(42,27,18,.4)'; ctx.lineWidth = 1.5; for (let k = 1; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x + 3, g.counterY - 2 + k * 13); ctx.lineTo(x + Math.min(32, cb - x) - 3, g.counterY - 2 + k * 13); ctx.stroke(); } }
      shelfStuff(ca, cb, g.counterY - 8);
    }
    pastryCase(g.cr - 36, g.counterY);
  } else if (L.scene === 'truck') {
    rr(g.cl - 2, g.counterY - 2, cw + 4, 9, 3); paint(P.steel);
    rr(g.cl + 2, g.counterY - 15, 18, 13, 3); paint(P.mustard, 2);
    pastryCase(g.cr - 34, g.counterY - 2);
  } else {
    rr(g.cl, g.counterY + 4, cw, 30, 3); paint(P['wood-2']);
    ctx.strokeStyle = 'rgba(42,27,18,.35)'; ctx.lineWidth = 2;
    for (let x = g.cl + 26; x < g.cr - 6; x += 26) { ctx.beginPath(); ctx.moveTo(x, g.counterY + 8); ctx.lineTo(x, g.counterY + 32); ctx.stroke(); }
    rr(g.cl - 4, g.counterY - 3, cw + 8, 9, 3); paint(P.wood);
    rr(g.cl + 2, g.counterY - 16, 20, 14, 3); paint(P.tomato, 2); rr(g.cl + 5, g.counterY - 13, 14, 5, 1); paint('#bfe6ee', 1.5);
    pastryCase(g.cr - 34, g.counterY - 3);
  }
  floorItems(g, t);
  if (S.up.sign) aFrame(outdoor() ? 74 : 72, 146);
  if (S.up.music && outdoor()) boombox(g.x0 - 50, 116);
  const people = sim.people.filter(p => !p.seated).sort((a, b) => a.y - b.y);
  for (const p of people) {
    let mood = 'meh';
    if (p.state === 'balk' || (p.state === 'leave' && !p.cup)) mood = 'mad';
    else if (p.cup) mood = p.happy > 0.25 ? 'happy' : 'meh';
    else if (p.state === 'queue' && p.c.deadline - sim.t < 150) mood = 'worried';
    figure(p.x, p.y, {kind:p.kind, you:p.you, skin:p.skin, hair:p.hair, shirt:p.shirt, style:p.style, hat:p.hat, cup:p.cup, mood, moving:p.moving, seed:p.seed}, t);
  }
  seating(g, sim.people.filter(p => p.seated), t);
  drones(t);
  notes(g, t);
  for (const f of sim.floats) { ctx.globalAlpha = clamp(f.life * 1.5, 0, 1); bubble(f.x, f.y - 40, f.text, f.kind); }
  ctx.globalAlpha = 1;
}


let last = 0, uiTick = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (phase === 'run' && sim && cv) {
    if (!sim.done) {
      const gdt = dt * GS * sim.speed, n = Math.max(1, Math.ceil(gdt / 20));
      for (let i = 0; i < n && !sim.done; i++) step(gdt / n);
    }
    updateVisuals(dt);
    draw();
    uiTick += dt;
    if (uiTick > 0.1) {
      uiTick = 0;
      $('#clock').textContent = fmtTime(Math.min(sim.t, CLOSE + 3599));
      const r = sim.closed ? '' : rushLabel(sim.t), re = $('#rush');
      re.hidden = !r; re.textContent = r;
      $('#l-served').textContent = sim.served;
      $('#l-lost').textContent = sim.lost.price + sim.lost.line + sim.lost.wait + sim.lost.stock;
      $('#l-sales').textContent = money0(sim.sales + sim.tips);
      $('#l-line').textContent = sim.queue.length;
    }
  }
  else if (cv && cv.offsetParent && phase !== 'run') { const keep = sim; sim = idleView(); draw(); sim = keep; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- report ---------- */
function renderReport() {
  const r = report, L = r.lost, lostAll = L.price + L.line + L.wait + L.stock, nx = LOC[S.tier + 1], cur = LC();
  const tips = [];
  if (L.line + L.wait > Math.max(4, r.visitors * 0.08)) tips.push(`The line cost you ${L.line + L.wait} customers. ${r.staff < r.maxStaff ? 'Another barista' : 'Seating, music or a bigger place'} would help the rushes.`);
  if (L.price > Math.max(4, r.visitors * 0.15)) tips.push(`${L.price} people looked at the prices and left. Try lowering your busiest drinks.`);
  if (L.price === 0 && r.served > 30) tips.push('Nobody balked at your prices. You can probably charge more.');
  if (r.stockOut.length) tips.push('You ran out of ' + r.stockOut.map(s => s === 'pastry' ? 'croissants' : s).join(' and ') + '. Check Supplies before opening.');
  if (r.tossed >= 5) tips.push(`${r.tossed} croissants went in the trash. Buy fewer trays.`);
  if (cur.rent && rentIn() <= 5 && S.cash < cur.rent) tips.push(`Rent of ${money0(cur.rent)} is due in ${rentIn()} day${rentIn() > 1 ? 's' : ''} and you're short.`);
  if (nx && S.cash >= nx.move) tips.push(`You can afford to move to the ${nx.name}.`);
  for (const n of r.exNotes) tips.push(n);
  const repD = r.repTo - r.repFrom;
  const line = (k, v, cls = '') => `<div class="rl"><span>${k}</span><span class="${cls}">${v}</span></div>`;
  const banner = S.over ? `<div class="banner" style="border-color:var(--tomato)"><b>Out of business</b>${S.overWhy} Start a new game below.</div>` : '';
  $('#main').innerHTML = `<div class="reportscroll">
    ${banner}
    <div class="receipt">
      <h2>Half Shot Café</h2>
      <div class="c">${r.place}<br>Day ${r.day} · ${r.dow} · ${r.wlabel}${r.earth ? ', ' + r.weather.temp + '°F' : ''}</div>
      ${line('Visitors', r.visitors)}
      ${line('Served', r.served)}
      ${line('Walked out', lostAll)}
      ${L.price ? line('&nbsp;&nbsp;prices too high', L.price) : ''}
      ${L.line ? line('&nbsp;&nbsp;line too long', L.line) : ''}
      ${L.wait ? line('&nbsp;&nbsp;gave up waiting', L.wait) : ''}
      ${L.stock ? line('&nbsp;&nbsp;sold out', L.stock) : ''}
      ${line('Best seller', r.best)}
      ${line('Avg wait', r.avgWait.toFixed(1) + ' min')}
      ${line('Croissants sold / tossed', r.pastrySold + ' / ' + r.tossed)}
      <hr>
      ${line('Sales', money(r.sales))}
      ${line('Tips', money(r.tips))}
      ${r.exInc || r.exUp ? line('Expansion income', money(r.exInc), 'pos') + line('Expansion upkeep', '−' + money(r.exUp), 'neg') : ''}
      ${line('Wages', '−' + money(r.wages), r.wages ? 'neg' : '')}
      ${r.rentBill ? line('Monthly rent', '−' + money(r.rentBill), 'neg') : ''}
      <hr>
      <div class="rl tot"><span>Net for the day</span><span class="${r.net >= 0 ? 'pos' : 'neg'}">${money(r.net)}</span></div>
      ${line('Cash on hand', money0(S.cash))}
      ${cur.rent && !S.over ? line('Next rent due', 'in ' + rentIn() + ' day' + (rentIn() > 1 ? 's' : '')) : ''}
      ${line('Reputation', Math.round(r.repFrom) + ' → ' + Math.round(r.repTo) + ' (' + (repD >= 0 ? '+' : '') + repD.toFixed(1) + ')', repD >= 0 ? 'pos' : 'neg')}
      ${tips.length ? `<hr><ul class="tips">${tips.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
      <div class="c" style="margin:14px 0 0">Thank you, come again</div>
    </div>
    </div><div class="actionbar">${S.over ? '' : `<button class="big" data-act="next">Plan day ${S.day} · ${DAYS[(S.day - 1) % 7]}</button>`}
  </div>`;
}

/* ---------- glue ---------- */
function render() {
  applyTheme();
  $('#app').classList.toggle('running', phase === 'run');
  $('#main').classList.toggle('busy', phase === 'run');
  if (phase !== 'run') for (const id of ['runbar','live','log']) $('#' + id).hidden = true;
  refreshColors();
  renderStats();
  if (phase === 'plan') renderPlan();
  else if (phase === 'report') renderReport();
  $('#resetwrap').innerHTML = confirmReset
    ? `Start over? <button class="link" data-act="reset-yes" style="color:var(--mustard)">Yes, wipe the shop</button> · <button class="link" data-act="reset-no">Cancel</button>`
    : `<button class="link" data-act="reset">New game</button>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tab') { tab = id; confirmMove = false; renderPlan(); return; }
  if (a === 'price') {
    const st = priceStep(), base = id === 'pastry' ? PASTRY_BASE : DMAP[id].base;
    S.prices[id] = roundTo(clamp(S.prices[id] + st * +b.dataset.d, st, base * LC().pm * 4), st); save(); renderPlan(); return;
  }
  if (a === 'buy') { const c = supCost(id), n = +b.dataset.n; if (S.cash >= c * n) { S.cash -= c * n; S.inv[id] += SUP[id].pack * n; save(); render(); } return; }
  if (a === 'hire') { if (S.staff < LC().staff) { S.staff++; save(); render(); } return; }
  if (a === 'fire') { if (S.staff > 1) { S.staff--; save(); render(); } return; }
  if (a === 'upg') { const u = UPG.find(x => x.id === id); if (!S.up[id] && S.cash >= u.cost) { S.cash -= u.cost; S.up[id] = true; save(); render(); } return; }
  if (a === 'exp') { const x = EMAP[id], L0 = S.exp[id] || 0, c = expCost(x, L0 + 1); if (x.tier <= S.tier && L0 < MAXLVL && S.cash >= c) { S.cash -= c; S.exp[id] = L0 + 1; save(); render(); } return; }
  if (a === 'move') { confirmMove = true; renderPlan(); return; }
  if (a === 'move-no') { confirmMove = false; renderPlan(); return; }
  if (a === 'move-yes') { doMove(); return; }
  if (a === 'open') { startDay(); renderStats(); return; }
  if (a === 'speed') { sim.speed = +b.dataset.v; document.querySelectorAll('.speeds button').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (a === 'next') { phase = 'plan'; tab = 'supplies'; render(); scrollTo(0, 0); return; }
  if (a === 'reset') { confirmReset = true; render(); return; }
  if (a === 'reset-no') { confirmReset = false; render(); return; }
  if (a === 'reset-yes') { confirmReset = false; S = newGame(); sim = null; phase = 'plan'; tab = 'menu'; welcome = null; confirmMove = false; save(); render(); scrollTo(0, 0); return; }
});

cv = $('#cv'); ctx = cv.getContext('2d');
new ResizeObserver(() => sizeCanvas()).observe($('.scene'));
render();
})();
</script>
</body>
</html>
