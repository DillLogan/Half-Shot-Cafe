<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Half Shot Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a cartoon stage fills the screen; a top bar holds the numbers, a bottom tab bar opens slide-up sheets (docked left on desktop) */
:root{
  --ink:#1d1a24; --ink-soft:#5b5466;
  --paper:#fffaf0; --paper-2:#f3ead8; --cream:#fff3d6;
  --teal:#2fb3a6; --teal-d:#1f8a80; --orange:#ff7a2f; --mustard:#ffc93c; --pink:#ff6fa5; --tomato:#f0473a; --leaf:#4cc35a; --leaf-ink:#23802f; --blue:#3f7fd1; --purple:#7d5bd6;
  --bg:#2a2340;
  --f-title:'Bungee','Arial Black',Impact,sans-serif;
  --f-ui:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-receipt:'Courier Prime','Courier New',monospace;
  --stage-bg:#bfe6ee;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:var(--f-ui);font-weight:700;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.5px);background-size:22px 22px}
html,body,button,input,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}

/* every control reacts like a real button */
.btn,.tab,.primary,.auto,.close,.speeds button,.link{transition:transform .08s ease,box-shadow .08s ease}
:is(.btn,.tab,.primary,.auto,.close,.speeds button):not(:disabled):is(:active,.pressed){transform:translateY(3px) scale(.96);box-shadow:0 0 0 var(--ink)}
.link:active,.link.pressed{transform:scale(.94)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;position:relative;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px 0;gap:8px}

.topbar{grid-row:1} .stage{grid-row:2} .tabbar{grid-row:3}
/* top bar */
.topbar{display:flex;align-items:center;gap:8px;min-width:0}
.logo{font-family:var(--f-title);font-size:1.15rem;line-height:1;color:var(--mustard);letter-spacing:.01em;white-space:nowrap;
  text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),3px 3px 0 var(--orange)}
.pills{display:flex;gap:6px;flex:1;min-width:0;justify-content:flex-end;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 10px 3px 4px;box-shadow:0 3px 0 var(--ink);min-width:0;white-space:nowrap}
.pill .ic{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:.8rem;font-weight:900;color:var(--ink)}
.pill .val{font-weight:900;font-variant-numeric:tabular-nums;font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.pill .lbl{font-size:.72rem;color:var(--ink-soft);font-weight:800;overflow:hidden;text-overflow:ellipsis}
.pill.warn .val{color:var(--tomato)}

/* the stage */
.stage{position:relative;min-height:0;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);overflow:hidden;background:var(--stage-bg);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:.92rem;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 var(--ink);animation:bubin .25s cubic-bezier(.3,1.7,.5,1);will-change:transform}
.bub.good{color:var(--leaf-ink)} .bub.bad{color:var(--tomato)}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
@keyframes bubin{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.loctag{font-family:var(--f-title);font-size:.8rem;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 9px;box-shadow:0 3px 0 var(--ink)}
.clock{font-family:var(--f-title);font-size:1.25rem;line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.rush{display:inline-block;margin-top:6px;font-family:var(--f-title);font-size:.75rem;background:var(--tomato);color:#fff;border:3px solid var(--ink);border-radius:9px;padding:3px 8px;box-shadow:0 3px 0 var(--ink);animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.speeds{display:flex;gap:5px}
.speeds button,.chipbtn{background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:4px 9px;font-weight:900;font-size:.88rem}
.speeds button[aria-pressed="true"]{background:var(--mustard)}
.livebar{position:absolute;left:10px;right:92px;bottom:12px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
.livebar .chip{background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:3px 9px;min-width:0}
.livebar .chip .k{font-size:.65rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.livebar .chip .v{font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.vibe{flex:1;max-width:190px;min-width:64px}
.vibe .meter{height:9px;border:2.5px solid var(--ink);border-radius:6px;background:var(--paper-2);overflow:hidden;margin-top:2px}
.vibe .meter i{display:block;height:100%;transition:width .3s,background .3s}
.ticker{position:absolute;left:10px;bottom:72px;background:rgba(29,26,36,.82);color:#fff;border-radius:10px;padding:3px 10px;font-size:.82rem;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.placebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 10px;width:max-content;max-width:calc(100% - 20px);z-index:3}
.placebar .msg{width:100%;text-align:center;font-size:.9rem;line-height:1.25}
.placebar .msg.bad{color:var(--tomato)}
.fab{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;align-items:stretch;z-index:2}
.primary{background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 18px;font-family:var(--f-title);font-size:1.05rem;letter-spacing:.01em;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.auto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:4px 9px;font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;min-width:62px}
.auto .sw{width:40px;height:22px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper-2);position:relative;transition:background .2s}
.auto .sw::after{content:"";position:absolute;top:1.5px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:left .2s cubic-bezier(.3,1.6,.5,1)}
.auto[aria-pressed="true"] .sw{background:var(--leaf)}
.auto[aria-pressed="true"] .sw::after{left:19px}

/* bottom tabs */
.tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px 0 max(8px,env(safe-area-inset-bottom,0px));}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:4px 0 3px;font-size:.7rem;font-weight:900;color:var(--ink);min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--mustard)}
.tab .dot{position:absolute;margin:-2px 0 0 22px;width:10px;height:10px;border-radius:50%;background:var(--tomato);border:2px solid var(--ink)}

/* sheet */
.sheet{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh,74px));height:min(64%,560px);z-index:10;
  background:var(--paper);border:3px solid var(--ink);border-radius:20px 20px 14px 14px;box-shadow:0 -4px 0 rgba(0,0,0,.15),0 5px 0 var(--ink);display:flex;flex-direction:column;
  transform:translateY(0);transition:transform .32s cubic-bezier(.3,1.25,.5,1),opacity .2s}
.sheet.closed{transform:translateY(calc(100% + 120px));opacity:0;pointer-events:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px 14px;border-bottom:3px solid var(--ink);flex-shrink:0;position:relative}
.sheethead::before{content:"";position:absolute;left:50%;top:4px;width:44px;height:5px;margin-left:-22px;border-radius:4px;background:var(--paper-2)}
.sheethead h2{font-family:var(--f-title);font-size:1.05rem;margin:4px 0 0;font-weight:400}
.close{width:34px;height:34px;border-radius:50%;background:var(--paper-2);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:1rem;line-height:1;display:grid;place-items:center}
#main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 14px 16px}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:11px 0;border-bottom:2.5px dashed rgba(29,26,36,.16)}
.item:last-child{border-bottom:0}
.item b{font-weight:900;font-size:1.02rem}
.item.locked{opacity:.5}
.item.wide{grid-template-columns:minmax(0,1fr)}
.sub{display:block;font-size:.86rem;color:var(--ink-soft);font-weight:700}
.good{color:var(--leaf-ink)} .bad{color:var(--tomato)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:5px 11px;font-size:.92rem;font-weight:900;white-space:nowrap}
.btn .m{color:var(--orange)}
.btn.go{background:var(--leaf);color:#fff;text-shadow:1px 1px 0 var(--ink)} .btn.go .m{color:#fff}
.owned{font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--leaf);border:3px solid var(--ink);border-radius:10px;padding:3px 8px;white-space:nowrap;text-shadow:1px 1px 0 var(--ink)}
.chip2{font-weight:900;font-size:.78rem;letter-spacing:.04em;border:3px solid var(--ink);border-radius:10px;padding:3px 8px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap}
.tier{font-weight:900;font-size:.78rem;color:#fff;background:var(--ink);border-radius:7px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.pips{display:inline-flex;gap:4px;vertical-align:-1px;margin-left:6px}
.pips i{width:11px;height:11px;border:2.5px solid var(--ink);border-radius:50%;background:#fff}
.pips i.on{background:var(--leaf)}
.note{font-size:.9rem;color:var(--ink-soft);margin:10px 0 2px}
.note strong{color:var(--ink)}
.sect{font-family:var(--f-title);font-size:.85rem;color:var(--orange);margin:14px 0 0;font-weight:400}
.summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;padding:10px 0 8px;border-bottom:2.5px dashed rgba(29,26,36,.16);font-size:.92rem}
.alerts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.alert{background:var(--mustard);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-size:.92rem}
.alert.hot{background:var(--tomato);color:#fff}
.banner{background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:14px;padding:12px 14px;text-align:center}
.banner b{font-family:var(--f-title);font-weight:400;font-size:1.2rem;color:var(--tomato);display:block}

/* price sliders */
.pricerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.price{font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:14px;border:3px solid var(--ink);border-radius:9px;background:linear-gradient(90deg,var(--leaf) 0 var(--lo),var(--mustard) var(--lo) var(--hi),var(--tomato) var(--hi))}
input[type=range]::-moz-range-track{height:9px;border:3px solid var(--ink);border-radius:9px;background:linear-gradient(90deg,var(--leaf) 0 var(--lo),var(--mustard) var(--lo) var(--hi),var(--tomato) var(--hi))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .1s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18);background:var(--mustard)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
input[type=range]:active::-moz-range-thumb{background:var(--mustard)}
.demand{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-soft)}
.demand .meter{flex:1;height:9px;border:2.5px solid var(--ink);border-radius:6px;background:var(--paper-2);overflow:hidden;max-width:170px}
.demand .meter i{display:block;height:100%}

/* market */
.tick{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:4px 10px;align-items:center}
.tick svg{width:110px;height:40px;display:block}
.chg{font-weight:900;font-size:.84rem}
.news{background:var(--ink);color:#fff;border-radius:12px;padding:7px 11px;margin:10px 0 2px;font-size:.88rem}
.news b{font-family:var(--f-title);font-weight:400;color:var(--mustard);margin-right:6px}

/* receipt */
.receipt{background:#fffdf6;color:var(--ink);font-family:var(--f-receipt);font-weight:400;font-size:.85rem;padding:24px 18px 30px;max-width:420px;width:100%;margin:10px auto;position:relative;
  filter:drop-shadow(0 4px 0 var(--ink));
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x}
.receipt h3{font-family:var(--f-title);font-weight:400;font-size:1.35rem;text-align:center;margin:0;color:var(--orange)}
.receipt .c{text-align:center;color:var(--ink-soft);margin:2px 0 12px}
.receipt hr{border:0;border-top:2px dashed var(--ink-soft);margin:9px 0}
.rl{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.rl.tot{font-weight:700;font-size:1.02rem}
.rl .neg{color:#b23a22} .rl .pos{color:var(--leaf-ink)}
.tips{margin:10px 0 0;padding:0 0 0 18px;font-family:var(--f-ui);font-weight:700;font-size:.92rem;color:var(--ink)}
.tips li{margin:3px 0}
.foot{display:flex;justify-content:center;gap:14px;margin:14px 0 4px;font-size:.85rem}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;padding:4px 2px;font-weight:800}

/* tutorial */
.tut{position:fixed;inset:0;z-index:50}
.tut .shade{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(20,14,30,.66);transition:all .45s cubic-bezier(.3,1.3,.5,1);outline:4px dashed var(--mustard);outline-offset:2px}
.tut .shade.none{box-shadow:none;outline:0;background:rgba(20,14,30,.66);inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.tutcard{position:absolute;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-end}
.tutcard .say{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;box-shadow:0 5px 0 var(--ink);padding:12px 14px 10px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tutcard .say b{font-family:var(--f-title);font-weight:400;font-size:1.05rem;color:var(--orange);display:block;margin-bottom:3px}
.tutcard .say p{margin:0 0 10px;font-size:.98rem}
.tutcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tutcard .dots{display:flex;gap:4px;flex-wrap:wrap}
.tutcard .dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.tutcard .dots i.on{background:var(--orange)}
.mascot{width:80px;height:98px;flex-shrink:0;animation:hop 1.1s ease-in-out infinite}
.mascot .lid{transform-origin:43px 30px;animation:tip 2.2s ease-in-out infinite}
.mascot .eye{animation:blink 3.4s infinite;transform-box:fill-box;transform-origin:center}
.mascot .steam path{animation:steam 1.8s ease-in-out infinite;opacity:0}
.mascot .steam path:nth-child(2){animation-delay:.6s} .mascot .steam path:nth-child(3){animation-delay:1.2s}
.mascot .arm{transform-origin:16px 62px;animation:wave .9s ease-in-out infinite alternate}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes tip{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-12deg)}90%{transform:rotate(6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
@keyframes wave{from{transform:rotate(10deg)}to{transform:rotate(-30deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards;border:2px solid var(--ink)}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (min-width:900px){
  .app{grid-template-columns:minmax(380px,430px) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:16px;padding-block:12px 12px}
  .topbar{grid-column:1/-1}
  .tabbar{grid-column:1;grid-row:2;padding:0}
  .stage{grid-column:2;grid-row:2/4}
  .sheet,.sheet.closed{position:relative;left:auto;right:auto;bottom:auto;height:auto;grid-column:1;grid-row:3;transform:none;opacity:1;pointer-events:auto;border-radius:16px}
  .sheet .close{display:none}
  .logo{font-size:1.6rem}
}
@media (max-width:600px){
  .item:has(.btns .btn + .btn){grid-template-columns:minmax(0,1fr)}
  .item:has(.btns .btn + .btn) .btns{justify-content:flex-start}
  .logo{font-size:.95rem}
  .pill{padding:2px 7px 2px 3px;gap:4px}
  .pill .ic{width:20px;height:20px;font-size:.7rem}
  .pill .val{font-size:.86rem}
  .pill .lbl,.pill.opt{display:none}
  .primary{font-size:.92rem;padding:9px 13px}
  .tick{grid-template-columns:minmax(0,1fr) 80px}
  .tick svg{width:80px}
  .tick .btns{grid-column:1/-1;justify-content:flex-start}
  .mascot{width:58px;height:72px}
  .clock{font-size:1.05rem}
  .speeds button{padding:3px 7px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="topbar">
    <div class="logo">Half Shot Café</div>
    <div class="pills" id="pills"></div>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="Shop menus"></nav>
  <section class="stage" id="view" aria-label="Your café. Customers walk in, line up and order.">
    <canvas id="cv"></canvas>
    <div id="bubbles"></div>
    <div class="hud" id="hud"></div>
    <div class="ticker" id="ticker" hidden></div>
    <div class="livebar" id="livebar" hidden></div>

}

function stepFor(pm) { return pm < 2 ? 0.05 : pm < 4 ? 0.1 : 0.25; }
function roundTo(v, s) { return Math.max(s, Math.round(v / s) * s); }

const wgroup = () => S.tier <= 3 ? 'earth' : S.tier <= 5 ? 'space' : S.tier === 6 ? 'mars' : 'weird';

const eqLvl = id => S.eq[id] || 0;
const unlocked = it => !it.needs || eqLvl(it.needs) > 0;
const supUnlocked = k => !SUP[k].needs || eqLvl(SUP[k].needs) > 0;
const stationCost = n => 150 * Math.pow(1.6, n - 2); // price of the n-th counter station
const wage = () => 100 * Math.pow(LC().pm, 0.6);
const slots = () => 1 + eqLvl('espresso');
const quality = () => 0.55 + 0.1 * eqLvl('grinder');
const priceStep = () => stepFor(LC().pm);
const beanDisc = () => (S.exp.roaster ? 0.7 : 1) * (S.exp.plantation ? 0.5 : 1);
const supPrice = k => SUP[k].base * LC().pm * S.mkt[k].m * (k === 'beans' ? beanDisc() : 1);
const unitCost = k => supPrice(k) / SUP[k].pack;
const itemCost = it => Object.entries(it.use).reduce((a, [k, q]) => a + q * unitCost(k), 0);
const milkQty = () => S.milk.reduce((a, l) => a + l.q, 0);
const milkLife = () => eqLvl('fridge') ? 8 : 5;
const have = k => k === 'milk' ? milkQty() : S.inv[k];

/* what your furniture, walls and floors add up to */
function effects() {
  let cozy = 0, seats = 0, pat = 0, traffic = 0;
  for (const it of S.items) { if (!it.placed) continue; const c = CMAP[it.id]; cozy += c.cozy || 0; seats += c.seats || 0; pat += c.patience || 0; traffic += c.traffic || 0; }

  if (S.tier >= 2) { if (S.finish.floor) cozy += 1; if (S.finish.paint) cozy += 1; }
  return {cozy, seats, cozyB:0.25 * (1 - Math.exp(-cozy / 30)), patience:1 + Math.min(.4, pat) + Math.min(.3, seats * .015),
    traffic:1 + Math.min(.35, traffic), attach:.26 + (eqLvl('case') ? .06 : 0) + Math.min(.1, seats * .01)};
}
const wtpBase = () => 0.95 + S.rep / 300 + (quality() - 0.55) + effects().cozyB;
// share of customers whose willingness to pay clears a price
const demandShare = (it, p) => clamp((1.35 - p / (it.base * LC().pm * wtpBase())) / 0.5, 0, 1);
const expectedVisitors = () => (LC().vb + S.rep * LC().vr) * effects().traffic * (1 + 0.08 * (S.exp.drones || 0)) * DOW[(S.day - 1) % 7] * W_OF(S.weather.id).traffic * (1 + (S.wom || 0));

/* expansions */
const expInc = (e, L) => e.inc * Math.pow(1.4, L - 1);
const expUp = (e, L) => e.up * Math.pow(1.3, L - 1);
const expCost = (e, L) => e.cost * Math.pow(1.6, L - 1);
function expNet(e, L) {
  if (!L) return 0;
  return expInc(e, L) * (0.5 + S.rep / 100) * (e.weekend ? 2 / 7 : 1) * (e.weather ? 0.97 : 1) * (e.breakdown ? 1 - e.breakdown : 1) - expUp(e, L);
}
const expTotal = () => EXP.reduce((a, e) => a + expNet(e, S.exp[e.id] || 0), 0);

/* ---------- market ---------- */
function marketStep() {
  const out = [];
  for (const k in SUP) {
    const mk = S.mkt[k];
    mk.m = Math.exp(Math.log(mk.m) * 0.85 + SUP[k].vol * gauss());
    mk.hist.push(mk.m); if (mk.hist.length > 24) mk.hist.shift();
  }
  if (Math.random() < 0.45) {
    const keys = Object.keys(SUP).filter(supUnlocked), k = pick(keys), [txt, dir] = pick(NEWS[k]);
    const shock = dir * rand(0.1, 0.28);
    S.mkt[k].m *= 1 + shock; S.mkt[k].hist[S.mkt[k].hist.length - 1] = S.mkt[k].m;
    out.push({k, text:txt, pct:shock});
  }
  S.news = out;
}

function startDay() {

    mUsed:0, visitors:expectedVisitors() * rand(0.9, 1.1), arrived:0, served:0, fx,

function pickDrink() {

}

    best:best ? MMAP[best[0]].name + ' (' + best[1] + ')' : '—', avgWait:sim.served ? sim.waitSum / sim.served / 60 : 0,

/* ---------- buying ---------- */
function buySupply(k, packs) {

  S.cash -= c;
  if (k === 'milk') S.milk.push({q:SUP.milk.pack * packs, exp:S.day + milkLife()});
  else S.inv[k] += SUP[k].pack * packs;
  return true;
}

function doMove() {
  const from = LC(), to = LOC[S.tier + 1];

  S.cash -= to.move;
  S.tier++;
  const ratio = to.pm / from.pm, st = priceStep();
  for (const k in S.prices) S.prices[k] = roundTo(S.prices[k] * ratio, st);
  S.rentDue = S.day + 29;
  S.stations = clamp(S.stations, 1, to.maxSt); if (S.staff > S.stations) S.staff = S.stations;
  for (const it of S.items) it.placed = false; // furniture goes to storage, ready to place in the new shop
  if (S.tier === FINAL) S.won = true;
  ui.welcome = to.name; ui.confirm = null; ui.tab = 'decor';
  ui.sheet = true; autoPlaceStorage(); save(); V.rebuild && V.rebuild(); render();
}

/* ---------- auto mode ---------- */
// Restocks for tomorrow's expected customers at today's market prices, then opens. Pauses on anything that needs you.
function autoRestock() {
  // buys what tomorrow's crowd needs, essentials first, as far as the cash goes
  const vis = expectedVisitors() * 1.15, ds = MENU.filter(m => m.kind === 'drink' && unlocked(m)), w = S.weather.id;
  const tot = ds.reduce((a, d) => a + d.w[w], 0), need = {};
  for (const d of ds) for (const [k, q] of Object.entries(d.use)) need[k] = (need[k] || 0) + vis * d.w[w] / tot * q;
  need.bakery = vis * effects().attach * 0.8;
  let short = false;
  for (const k of ['cups', 'beans', 'milk', 'tea', 'matcha', 'bakery']) {
    if (!need[k] || !supUnlocked(k)) continue;
    const want = Math.ceil(Math.max(0, need[k] - have(k)) / SUP[k].pack);
    const can = Math.min(want, Math.floor(S.cash / supPrice(k)));
    if (can > 0) buySupply(k, can);

}

  if (!S.auto || S.over) return;
  ui.autoTimer = setTimeout(() => {
    if (!S.auto || phase !== 'report') return;
    const nx = LOC[S.tier + 1], L = LC();
    let why = '';
    if (nx && S.cash >= nx.move) why = `Auto mode paused: you can afford the ${nx.name}. Check the Move tab.`;
    else if (L.rent && rentIn() <= 2 && S.cash < L.rent * 1.1) why = `Auto mode paused: rent of ${money0(L.rent)} is due soon and you're short.`;

    save(); startDay(); render();
  }, 2600);
}

// Front "stage set" view: the back wall faces you, the floor recedes slightly, everything is flat color with thick ink outlines.

}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  const clearMsgs = () => { ui.autoMsg = ''; ui.msg = ''; ui.welcome = null; };
  switch (a) {
    case 'tab': if (phase === 'run') return; if (phase === 'report') { clearTimeout(ui.autoTimer); phase = 'plan'; } if (ui.sheet && ui.tab === id && !DESK()) ui.sheet = false; else { ui.tab = id; ui.sheet = true; } ui.confirm = null; ui.sel = null; clearMsgs(); render(); return;
    case 'close': ui.sheet = false; ui.sel = null; ui.confirm = null; render(); return;
    case 'buy': if (buySupply(id, +b.dataset.n)) { save(); V.rebuild(); } render(); return;
    case 'fill': { const why = autoRestock(); ui.msg = why || 'Stocked up for tomorrow.'; save(); V.rebuild(); render(); return; }
    case 'hire': if (S.staff < S.stations) { S.staff++; save(); V.rebuild(); render(); } return;
    case 'fire': if (S.staff > 1) { S.staff--; save(); V.rebuild(); render(); } return;
    case 'station': {
      const n = S.stations + 1, c = stationCost(n);
      if (n > LC().maxSt || S.cash < c) return;
      const blocked = S.items.some(it => it.placed && footprint(it.id, it.x, it.z, it.rot || 0).some(([x, z]) => z <= 1 && x <= n + (gridInfo().truck ? 1 : 0)));
      if (blocked) { ui.msg = 'Something is standing where the new counter section goes. Move the furniture next to the counter first.'; render(); return; }
      S.cash -= c; S.stations = n; save(); V.rebuild(); render(); return;
    }
    case 'eq': { const e = EMAPQ[id], nx = e.levels[eqLvl(id) + 1]; if (nx && S.cash >= nx[1]) { S.cash -= nx[1]; S.eq[id] = eqLvl(id) + 1; if (id === 'kettle' && !S.inv.tea) S.inv.tea = 0; save(); V.rebuild(); render(); } return; }
    case 'buyItem': { const c = CMAP[id]; if (S.cash < c.cost) return; S.cash -= c.cost; const it = {uid:S.uid++, id, placed:false}; S.items.push(it); save(); startPlacing(it.uid, 'new'); return; }

    case 'sell': { const i = S.items.findIndex(x => x.uid === +b.dataset.uid); if (i >= 0) { S.cash += Math.round(CMAP[S.items[i].id].cost * .5); S.items.splice(i, 1); save(); render(); } return; }
    case 'floor': { const f = FLOORS.find(x => x.id === id); if (!S.finish.floors.includes(id)) { if (S.cash < f.cost) return; S.cash -= f.cost; S.finish.floors.push(id); } S.finish.floor = id; save(); V.rebuild(); render(); return; }
    case 'paint': { const p = PAINTS.find(x => x.id === id); if (!S.finish.paints.includes(id)) { if (S.cash < p.cost) return; S.cash -= p.cost; S.finish.paints.push(id); } S.finish.paint = id; save(); V.rebuild(); render(); return; }
    case 'wall': { const w = WALLITEMS.find(x => x.id === id); if ((S.walls[id] || 0) >= w.max || S.cash < w.cost) return; S.cash -= w.cost; S.walls[id] = (S.walls[id] || 0) + 1; save(); V.rebuild(); render(); return; }
    case 'exp': {
      const x = EXMAP[id], L0 = S.exp[id] || 0, c = expCost(x, L0 + 1);
      if (x.tier > S.tier || L0 >= MAXLVL || S.cash < c) return;

    case 'reset': if (phase === 'run') return; ui.confirm = {kind:'reset', title:'Start a new game?', text:'This wipes your shop, cash and progress.', yes:'Yes, start over'}; ui.sheet = true; $('#main').scrollTop = 0; render(); $('#main').scrollTop = 0; return;

let last = 0, uiTick = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (phase === 'run' && sim) {
    if (!sim.done) { const gdt = dt * GS * sim.speed, n = Math.max(1, Math.ceil(gdt / 20)); for (let i = 0; i < n && !sim.done; i++) step(gdt / n); }
    uiTick += dt;
    if (uiTick > .15 && $('#clock')) {
      uiTick = 0;
      $('#clock').textContent = fmtTime(Math.min(sim.t, CLOSE + 3599));
      const r = sim.closed ? '' : rushLabel(sim.t), re = $('#rush'); re.hidden = !r; re.textContent = r;
      $('#l-served').textContent = sim.served;
      $('#l-lost').textContent = sim.lost.price + sim.lost.line + sim.lost.wait + sim.lost.stock;
      $('#l-sales').textContent = money0(sim.sales + sim.tips);
      const ms = sim.queue.map(c => c.mood).concat(sim.moods.slice(-12)), avg = ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0;
      $('#l-vibe').textContent = '· ' + ['Grumpy', 'Tense', 'Okay', 'Good', 'Great'][moodIdx(avg)];
      const vb = $('#l-vbar'); vb.style.width = Math.round((avg + 1) / 2 * 100) + '%'; vb.style.background = avg > .2 ? 'var(--leaf)' : avg > -.2 ? 'var(--mustard)' : 'var(--tomato)';
      $('#ticker').textContent = sim.logs[0] ? sim.logs[0].text : '';
      renderPills();
    }
  }
  frame3D(dt, ts / 1000);
  requestAnimationFrame(frame);
}
init3D();
render();
requestAnimationFrame(frame);
if (!S.tutDone) setTimeout(() => showTut(0), 700);

})();
</script>
